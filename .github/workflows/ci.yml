name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Test safety and demo lifecycle
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest -q
