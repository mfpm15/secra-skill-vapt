name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python and pinned Sapper-v2
        run: python -m compileall -q app vendor/sapper_v2 scripts
      - name: Offline OpenCode skill and MCP config regression tests
        run: python -m pytest tests/opencode -q -ra
      - name: Process lead registry, workspace lifecycle and handoff regression
        env:
          SECRA_DASHBOARD_TOKEN: ci-local-process-token
          SECRA_DATA_DIR: /tmp/secra-process-test
        run: python -m pytest tests/process tests/continuity tests/workspace -q -ra
      - name: Baseline compatibility and local upgrade checkpoint safety
        run: python -m pytest tests/process/test_ares_legacy_contract.py tests/process/test_upgrade_checkpoint.py -q -ra
      - name: Non-gating offline planning latency diagnostics (no target traffic)
        run: python scripts/secra_plan_benchmark.py --iterations 200 --warmup 20
      - name: Phase 1 masking corpus and leakage acceptance tests (zero skipped)
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/masking -q -ra
      - name: Gateway encrypted evidence and safety integration
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/gateway -q -ra
      - name: Fence offline contracts (Kali lab required for production)
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/fence -m "not lab" -q -ra
      - name: Deterministic framing and wire-byte privacy acceptance
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/framing -q -ra
      - name: MCP tools/list, model-tool-feedback, operator UI and real localhost boot (zero skipped)
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only-12345
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/e2e -q -ra
      - name: Test scope, privacy, knowledge, Sapper graph and demo lifecycle
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest -m "not lab" -q
