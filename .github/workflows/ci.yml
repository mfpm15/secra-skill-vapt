name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python and pinned Sapper-v2
        run: python -m compileall -q app vendor/sapper_v2
      - name: Phase 1 masking corpus and leakage acceptance tests (zero skipped)
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/masking -q -ra
      - name: Phase 2 gateway safety and evidence integration tests (zero skipped)
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/gateway -q -ra
      - name: Fence contract tests only (kernel lab is mandatory separately)
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest tests/fence -m "not lab" -q -ra
      - name: Test scope, privacy, knowledge, Sapper graph and demo lifecycle
        env:
          SECRA_DASHBOARD_TOKEN: ci-test-token-only
          SECRA_DATA_DIR: /tmp/secra-vapt-test
        run: python -m pytest -m "not lab" -q
